<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>SleepTracker AI (GitHub Auto-Loader)</title>
<meta name="theme-color" content="#090d16">
<style>
  :root{
    --bg:#090d16; --card:#131b2e; --card-hover:#1a253f; --line:#1e293b; --text:#f1f5f9; --muted:#94a3b8;
    --snore:#38bdf8; --brux:#f59e0b; --talk:#a855f7; --fart:#10b981; --env:#64748b;
    --primary:#6366f1; --danger:#ef4444; --github:#2ea44f;
  }
  *{ box-sizing:border-box; margin:0; padding:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; -webkit-tap-highlight-color:transparent; }
  body{ background:var(--bg); color:var(--text); line-height:1.4; padding-bottom:80px; }
  .top{ position:sticky; top:0; z-index:40; background:#090d16eb; backdrop-filter:blur(12px); border-bottom:1px solid var(--line); }
  .top-inner{ max-width:960px; height:56px; margin:0 auto; padding:0 16px; display:flex; align-items:center; justify-content:space-between; }
  .brand{ display:flex; align-items:center; gap:8px; font-weight:800; font-size:15px; color:#fff; }
  .brand span{ color:var(--primary); font-size:11px; background:#1e1b4b; padding:2px 6px; border-radius:6px; }
  .container{ max-width:960px; margin:14px auto 0; padding:0 14px; display:flex; flex-direction:column; gap:14px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; box-shadow:0 4px 12px rgba(0,0,0,.3); }
  .hidden{ display:none !important; }
  .row{ display:flex; align-items:center; gap:8px; }
  .col{ display:flex; flex-direction:column; gap:10px; }
  .btn{ border:1px solid transparent; border-radius:12px; padding:12px 16px; font-size:13px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:.15s all; }
  .btn:active{ transform:scale(.97); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn-primary{ background:var(--primary); color:#fff; }
  .btn-danger{ background:var(--danger); color:#fff; }
  .btn-soft{ background:#1e293b; border-color:#334155; color:#cbd5e1; }
  .badge{ display:inline-flex; align-items:center; border-radius:999px; padding:3px 8px; font-size:11px; font-weight:800; }
  .b-gray{ background:#334155; color:#cbd5e1; }
  .b-green{ background:#064e3b; color:#34d399; }
  .b-gh{ background:#164e63; color:#38bdf8; border:1px solid #0284c7; }
  .tabs{ display:flex; border-bottom:1px solid var(--line); gap:8px; margin-bottom:4px; }
  .tab{ border:none; background:transparent; padding:12px 16px; color:var(--muted); font-size:13px; font-weight:700; border-bottom:2px solid transparent; cursor:pointer; }
  .tab.active{ color:#fff; border-bottom-color:var(--primary); }

  /* GitHub同期インジケーター */
  .gh-bar{ background:#0d1527; border:1px solid #1e293b; border-radius:10px; padding:8px 12px; display:flex; align-items:center; justify-content:space-between; font-size:11px; gap:8px; }
  .gh-status{ display:flex; align-items:center; gap:6px; }
  .gh-dot{ width:8px; height:8px; border-radius:50%; background:#94a3b8; }
  .gh-dot.live{ background:#10b981; box-shadow:0 0 8px #10b981; }

  /* カテゴリ別タグ */
  .tag-snore{ background:#0369a133; color:var(--snore); border:1px solid #0284c755; }
  .tag-brux{ background:#b4530933; color:var(--brux); border:1px solid #d9770655; }
  .tag-talk{ background:#6b21a833; color:var(--talk); border:1px solid #9333ea55; }
  .tag-fart{ background:#065f4633; color:var(--fart); border:1px solid #05966955; }
  .tag-env{ background:#33415544; color:var(--env); border:1px solid #47556955; }

  .clip-item{ background:#101726; border:1px solid var(--line); border-radius:12px; padding:12px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .play-btn{ width:40px; height:40px; border-radius:50%; background:var(--primary); color:#fff; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; font-size:14px; }
  .clip-info{ display:flex; flex-direction:column; gap:3px; flex:1; }
  .clip-title{ font-weight:800; font-size:13px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .clip-sub{ font-size:11px; color:var(--muted); }

  .filter-bar{ display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; scrollbar-width:none; }
  .filter-btn{ background:#1e293b; border:1px solid #334155; color:var(--muted); border-radius:20px; padding:5px 12px; font-size:11px; font-weight:700; cursor:pointer; white-space:nowrap; }
  .filter-btn.active{ background:var(--primary); color:#fff; border-color:var(--primary); }

  .meter-bar{ height:6px; background:#1e293b; border-radius:3px; overflow:hidden; }
  .meter-fill{ height:100%; width:0%; background:#10b981; transition:width .08s linear; }
  .stat-val{ font-size:20px; font-weight:900; color:#fff; font-family:ui-monospace,Menlo,monospace; }
  .stat-k{ font-size:11px; color:var(--muted); }

  #toastWrap{ position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:100; width:min(90vw,400px); display:flex; flex-direction:column; gap:8px; pointer-events:none; }
  .toast{ background:rgba(15,23,42,.95); border:1px solid #334155; color:#fff; border-radius:10px; padding:12px; font-size:12px; text-align:center; box-shadow:0 8px 20px rgba(0,0,0,.5); }
</style>
</head>
<body>
<div id="toastWrap"></div>

<header class="top">
  <div class="top-inner">
    <div class="brand">🌙 SleepTracker <span>Auto-Sync</span></div>
    <div id="statusBadge" class="badge b-gray">待機中</div>
  </div>
</header>

<main class="container">
  <!-- GitHub 動的ロードステータス -->
  <div class="gh-bar">
    <div class="gh-status">
      <div id="ghDot" class="gh-dot"></div>
      <span id="ghStatusText" style="color:#cbd5e1;">GitHubコード同期: 初期化中...</span>
    </div>
    <button class="btn btn-soft" style="padding:4px 8px; font-size:10px;" onclick="GitHubLoader.forceReload()">強制再読込</button>
  </div>

  <div class="tabs">
    <button id="tab-rec" class="tab active" onclick="App.switchTab('rec')">測定・モニタ</button>
    <button id="tab-clips" class="tab" onclick="App.switchTab('clips')">分類録音一覧（再生確認）</button>
  </div>

  <!-- 1. 測定画面 -->
  <section id="panel-rec" class="col">
    <div class="card col" style="text-align:center; padding:22px 16px;">
      <div class="stat-k">経過時間（周波数分類＆低発熱モード稼働中）</div>
      <div id="timerText" style="font-size:36px; font-weight:900; margin:4px 0 14px; font-family:ui-monospace,monospace;">00:00:00</div>

      <div class="col" style="max-width:320px; margin:0 auto; width:100%; gap:6px;">
        <div class="row" style="justify-content:space-between; font-size:11px; color:var(--muted);">
          <span>入力音量: <b id="dbText" style="color:#fff;">-- dB</b></span>
          <span>直近判定: <b id="liveClassText" style="color:var(--primary);">待機中</b></span>
        </div>
        <div class="meter-bar"><div id="meterFill" class="meter-fill"></div></div>
        <div class="row" style="justify-content:space-between; font-size:10px; color:var(--muted);">
          <span>周波数重心: <span id="specCentroidText">-- Hz</span></span>
          <span>寝室底面: <span id="baseText">-- dB</span></span>
        </div>
      </div>

      <div class="row" style="margin-top:20px; justify-content:center;">
        <button id="btnStart" class="btn btn-primary" style="flex:1; max-width:180px;" onclick="App.startTracking()">睡眠測定を開始</button>
        <button id="btnStop" class="btn btn-danger" style="flex:1; max-width:180px;" onclick="App.stopTracking()" disabled>測定終了</button>
      </div>
    </div>

    <!-- カテゴリ別集計グリッド -->
    <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:8px;">
      <div class="card col" style="padding:10px; text-align:center;">
        <div class="stat-k">😴 いびき</div>
        <div id="count-snore" class="stat-val" style="color:var(--snore);">0</div>
      </div>
      <div class="card col" style="padding:10px; text-align:center;">
        <div class="stat-k">😬 歯ぎしり</div>
        <div id="count-brux" class="stat-val" style="color:var(--brux);">0</div>
      </div>
      <div class="card col" style="padding:10px; text-align:center;">
        <div class="stat-k">🗣 寝言</div>
        <div id="count-talk" class="stat-val" style="color:var(--talk);">0</div>
      </div>
      <div class="card col" style="padding:10px; text-align:center;">
        <div class="stat-k">💨 おなら</div>
        <div id="count-fart" class="stat-val" style="color:var(--fart);">0</div>
      </div>
      <div class="card col" style="padding:10px; text-align:center;">
        <div class="stat-k">🛏 環境音/寝返り</div>
        <div id="count-env" class="stat-val" style="color:var(--env);">0</div>
      </div>
      <div class="card col" style="padding:10px; text-align:center;">
        <div class="stat-k">⚠️ 無呼吸疑い</div>
        <div id="count-apnea" class="stat-val" style="color:#f43f5e;">0</div>
      </div>
    </div>
  </section>

  <!-- 2. 分類録音一覧画面 -->
  <section id="panel-clips" class="hidden col">
    <div class="card col">
      <div class="row" style="justify-content:space-between; flex-wrap:wrap;">
        <div>
          <strong>検出音声クリップ（耳で答え合わせ）</strong>
          <div style="font-size:11px; color:var(--muted);">タップして実際の音声を再生し、分類を確認できます</div>
        </div>
        <button class="btn btn-soft" style="padding:6px 10px; font-size:11px;" onclick="App.clearClips()">全消去</button>
      </div>

      <div class="filter-bar" style="margin-top:6px;">
        <button class="filter-btn active" onclick="App.filterCategory('all', this)">すべて (<span id="fc-all">0</span>)</button>
        <button class="filter-btn" onclick="App.filterCategory('snore', this)">😴 いびき (<span id="fc-snore">0</span>)</button>
        <button class="filter-btn" onclick="App.filterCategory('bruxism', this)">😬 歯ぎしり (<span id="fc-brux">0</span>)</button>
        <button class="filter-btn" onclick="App.filterCategory('talk', this)">🗣 寝言 (<span id="fc-talk">0</span>)</button>
        <button class="filter-btn" onclick="App.filterCategory('fart', this)">💨 おなら (<span id="fc-fart">0</span>)</button>
        <button class="filter-btn" onclick="App.filterCategory('env', this)">🛏 環境音 (<span id="fc-env">0</span>)</button>
      </div>

      <div id="clipList" class="col" style="gap:8px; margin-top:4px;">
        <div style="text-align:center; padding:30px; font-size:12px; color:var(--muted);">録音データはまだありません。</div>
      </div>
    </div>
  </section>
</main>
<!-- ==========================================
     GitHub Dynamic Loader (最新コード動的実行エンジン)
     ========================================== -->
<script>
  const GitHubLoader = (() => {
    // ご自身のGitHub Raw URLまたはリポジトリのパスを指定（クエリパラメータ?t=でキャッシュを強制破棄）
    const GITHUB_CONFIG_KEY = 'ST_GITHUB_RAW_URL';
    // デフォルトURL（必要に応じてご自身のリポジトリに変更可能）
    const DEFAULT_URL = 'https://raw.githubusercontent.com/user/sleeptracker/main/app-core.js';

    function getUrl() {
      return localStorage.getItem(GITHUB_CONFIG_KEY) || DEFAULT_URL;
    }

    function updateStatus(text, isSuccess = false, isLive = false) {
      const txtEl = document.getElementById('ghStatusText');
      const dotEl = document.getElementById('ghDot');
      if (txtEl) txtEl.textContent = text;
      if (dotEl) {
        dotEl.className = 'gh-dot' + (isLive ? ' live' : '');
        if (!isLive && !isSuccess) dotEl.style.background = 'var(--danger)';
      }
    }

    async function fetchLatestRemoteScript() {
      const targetUrl = getUrl();
      // キャッシュを100%無視するタイムスタンプクエリ
      const cacheBusterUrl = targetUrl + (targetUrl.includes('?') ? '&' : '?') + '_t=' + Date.now();

      updateStatus('GitHubから最新コードをフェッチ中...', false, false);

      try {
        const res = await fetch(cacheBusterUrl, {
          method: 'GET',
          cache: 'no-store', // ブラウザキャッシュを完全無効化
          headers: { 'Pragma': 'no-cache', 'Cache-Control': 'no-cache' }
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const remoteCode = await res.text();

        if (remoteCode && remoteCode.length > 50) {
          // 次回オフライン用に保存
          localStorage.setItem('ST_CACHED_REMOTE_SCRIPT', remoteCode);
          updateStatus('GitHub最新版コードを動的適用完了', true, true);
          
          // 動的インジェクション実行
          const scriptEl = document.createElement('script');
          scriptEl.text = remoteCode;
          document.body.appendChild(scriptEl);
          return true;
        } else {
          throw new Error('Script is empty');
        }
      } catch (err) {
        console.warn('[GitHubLoader] リモートフェッチをスキップし、内蔵スクリプト/ローカルキャッシュで起動します:', err.message);
        
        // オフラインキャッシュがあるか確認
        const cachedCode = localStorage.getItem('ST_CACHED_REMOTE_SCRIPT');
        if (cachedCode) {
          updateStatus(`オフライン（前回保存版で実行）: ${err.message}`, true, false);
          const scriptEl = document.createElement('script');
          scriptEl.text = cachedCode;
          document.body.appendChild(scriptEl);
          return true;
        } else {
          updateStatus(`内蔵ローカルエンジンで起動中 (${err.message})`, true, false);
          return false; // 内蔵Appを実行
        }
      }
    }

    function forceReload() {
      const newUrl = prompt('GitHub Raw URLを入力してください:', getUrl());
      if (newUrl) {
        localStorage.setItem(GITHUB_CONFIG_KEY, newUrl.trim());
        location.reload(true);
      }
    }

    return {
      init: fetchLatestRemoteScript,
      forceReload
    };
  })();
</script>

<!-- ==========================================
     SleepTracker Core (内蔵スタンドアロンエンジン)
     ※ GitHubロード成功時は上書き拡張可能
     ========================================== -->
<script>
  const App = (() => {
    const DB_NAME = 'SleepTrackerClassifierV4DB';
    const DB_VERSION = 1;
    let db = null;

    function initDB() {
      return new Promise((resolve) => {
        try {
          const req = indexedDB.open(DB_NAME, DB_VERSION);
          req.onerror = () => resolve(null);
          req.onsuccess = (e) => { db = e.target.result; resolve(db); };
          req.onupgradeneeded = (e) => {
            const d = e.target.result;
            if (!d.objectStoreNames.contains('clips')) {
              d.createObjectStore('clips', { keyPath: 'id' });
            }
          };
        } catch(err) {
          resolve(null);
        }
      });
    }

    async function saveClipToDB(clip) {
      if (!db) await initDB();
      if (!db) return;
      return new Promise((resolve) => {
        try {
          const tx = db.transaction('clips', 'readwrite');
          tx.objectStore('clips').put(clip);
          tx.oncomplete = () => resolve();
          tx.onerror = () => resolve();
        } catch(e) { resolve(); }
      });
    }

    async function getClipsFromDB() {
      if (!db) await initDB();
      if (!db) return [];
      return new Promise((resolve) => {
        try {
          const tx = db.transaction('clips', 'readonly');
          const req = tx.objectStore('clips').getAll();
          req.onsuccess = () => resolve((req.result || []).sort((a,b) => Number(b.id) - Number(a.id)));
          req.onerror = () => resolve([]);
        } catch(e) { resolve([]); }
      });
    }

    async function clearClipsFromDB() {
      if (!db) await initDB();
      if (!db) return;
      return new Promise((resolve) => {
        try {
          const tx = db.transaction('clips', 'readwrite');
          tx.objectStore('clips').clear();
          tx.oncomplete = () => resolve();
          tx.onerror = () => resolve();
        } catch(e) { resolve(); }
      });
    }

    let isTracking = false;
    let stream = null;
    let audioCtx = null;
    let analyser = null;
    let timeBuf = null;
    let freqBuf = null;
    let wakeLock = null;

    let timerInterval = null;
    let monitorInterval = null;
    let recSec = 0;

    let currentDb = 24.0;
    let baselineDb = 24.0;
    let baselineSamples = [];

    let mediaRecorder = null;
    let currentRecordingChunks = [];
    let isClipRecording = false;
    let clipStopTimeout = null;
    let currentClipMeta = null;

    let lastTriggerTime = 0;
    const TRIGGER_COOLDOWN_MS = 5000; // 連続過剰録音防止（5秒）

    let snoreTimestamps = [];
    let silenceStartTime = null;

    const counts = { snore: 0, bruxism: 0, talk: 0, fart: 0, env: 0, apnea: 0 };
    let currentFilter = 'all';
    let currentAudioPlayer = null;

    function toast(msg) {
      const wrap = document.getElementById("toastWrap");
      if(!wrap) return;
      const t = document.createElement("div");
      t.className = "toast";
      t.textContent = msg;
      wrap.appendChild(t);
      setTimeout(() => {
        t.style.opacity = "0";
        t.style.transition = "opacity .3s";
        setTimeout(() => t.remove(), 300);
      }, 2200);
    }

    function formatHMS(sec) {
      const h = String(Math.floor(sec/3600)).padStart(2,"0");
      const m = String(Math.floor((sec%3600)/60)).padStart(2,"0");
      const s = String(sec%60).padStart(2,"0");
      return `${h}:${m}:${s}`;
    }

    function switchTab(t) {
      const tabRec = document.getElementById("tab-rec");
      const tabClips = document.getElementById("tab-clips");
      const panelRec = document.getElementById("panel-rec");
      const panelClips = document.getElementById("panel-clips");

      if(t === 'rec') {
        tabRec.classList.add("active");
        tabClips.classList.remove("active");
        panelRec.classList.remove("hidden");
        panelClips.classList.add("hidden");
      } else {
        tabRec.classList.remove("active");
        tabClips.classList.add("active");
        panelRec.classList.add("hidden");
        panelClips.classList.remove("hidden");
        renderClipList();
      }
    }

    async function requestWakeLock() {
      try {
        if ("wakeLock" in navigator) {
          wakeLock = await navigator.wakeLock.request("screen");
        }
      } catch(e) {}
    }

    function releaseWakeLock() {
      if(wakeLock) { wakeLock.release().catch(()=>{}); wakeLock = null; }
    }

    function calcDb() {
      if(!analyser || !timeBuf) return 24.0;
      analyser.getFloatTimeDomainData(timeBuf);
      let sum = 0;
      for(let i=0; i<timeBuf.length; i++) sum += timeBuf[i] * timeBuf[i];
      const rms = Math.sqrt(sum / timeBuf.length);
      if(rms <= 1e-7) return 20.0;
      return Math.min(95, Math.max(20, 20 * Math.log10(rms) + 72));
    }

    function analyzeFrequencySpectrum() {
      if(!analyser || !freqBuf) return { centroid: 0, subLowRatio: 0, lowRatio: 0, midRatio: 0, highRatio: 0 };
      analyser.getByteFrequencyData(freqBuf);

      const binCount = analyser.frequencyBinCount;
      const sampleRate = audioCtx ? audioCtx.sampleRate : 44100;
      const binHz = (sampleRate / 2) / binCount;

      let totalPower = 0;
      let weightedSum = 0;
      let subLowPower = 0;
      let lowPower = 0;
      let midPower = 0;
      let highPower = 0;

      for(let i = 0; i < binCount; i++) {
        const freq = i * binHz;
        const amp = freqBuf[i];
        const power = amp * amp;
        totalPower += power;
        weightedSum += freq * power;

        if(freq >= 40 && freq < 200) subLowPower += power;
        else if(freq >= 200 && freq < 600) lowPower += power;
        else if(freq >= 600 && freq < 2500) midPower += power;
        else if(freq >= 2500 && freq <= 8000) highPower += power;
      }

      const centroid = totalPower > 0 ? (weightedSum / totalPower) : 0;
      return {
        centroid: Math.round(centroid),
        subLowRatio: totalPower > 0 ? (subLowPower / totalPower) : 0,
        lowRatio: totalPower > 0 ? (lowPower / totalPower) : 0,
        midRatio: totalPower > 0 ? (midPower / totalPower) : 0,
        highRatio: totalPower > 0 ? (highPower / totalPower) : 0
      };
    }

    function classifySound(deltaDb, spec) {
      if (deltaDb < 5.0) return null;

      const { centroid, subLowRatio, lowRatio, midRatio, highRatio } = spec;

      // 1. おなら
      if (subLowRatio > 0.48 && centroid < 300) {
        return { category: 'fart', label: '💨 おなら', tagClass: 'tag-fart' };
      }
      // 2. 歯ぎしり / 食いしばり音
      if (highRatio > 0.28 || (centroid > 1800 && deltaDb >= 12)) {
        return { category: 'bruxism', label: '😬 歯ぎしり / 硬音', tagClass: 'tag-brux' };
      }
      // 3. 寝言
      if (midRatio > 0.42 && centroid >= 500 && centroid <= 1800) {
        return { category: 'talk', label: '🗣 寝言', tagClass: 'tag-talk' };
      }
      // 4. いびき（単発も拾う）
      if (lowRatio > 0.35 || (centroid >= 200 && centroid < 700)) {
        return { category: 'snore', label: '😴 いびき', tagClass: 'tag-snore' };
      }
      // 5. 環境音 / 寝返り
      return { category: 'env', label: '🛏 環境音 / 寝返り', tagClass: 'tag-env' };
    }

    function triggerClipRecording(classResult, peakDb, durationMs = 10000) {
      const now = Date.now();
      if (isClipRecording) return;
      if (now - lastTriggerTime < TRIGGER_COOLDOWN_MS) return;

      lastTriggerTime = now;
      isClipRecording = true;
      currentRecordingChunks = [];

      currentClipMeta = {
        id: String(now),
        category: classResult.category,
        label: classResult.label,
        tagClass: classResult.tagClass,
        peakDb: peakDb,
        timeStr: formatHMS(recSec),
        realClock: new Date().toLocaleTimeString("ja-JP", { hour:"2-digit", minute:"2-digit", second:"2-digit" }),
        durationSec: Math.round(durationMs / 1000)
      };

      try {
        const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : (MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : '');
        const options = mime ? { mimeType: mime } : {};
        mediaRecorder = new MediaRecorder(stream, options);

        mediaRecorder.ondataavailable = (e) => {
          if(e.data && e.data.size > 0) currentRecordingChunks.push(e.data);
        };

        mediaRecorder.onstop = async () => {
          const blob = new Blob(currentRecordingChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
          if (currentClipMeta && blob.size > 0) {
            const clipRecord = {
              ...currentClipMeta,
              blob: blob
            };
            await saveClipToDB(clipRecord);
            counts[clipRecord.category] = (counts[clipRecord.category] || 0) + 1;
            updateCountUI();
            toast(`録音保存: ${clipRecord.label}`);
          }
          isClipRecording = false;
          currentClipMeta = null;
        };

        mediaRecorder.start();

        clearTimeout(clipStopTimeout);
        clipStopTimeout = setTimeout(() => {
          if(mediaRecorder && mediaRecorder.state === "recording") {
            mediaRecorder.stop();
          }
        }, durationMs);

      } catch(err) {
        console.error("Recording error:", err);
        isClipRecording = false;
      }
    }

    function updateCountUI() {
      const setVal = (id, val) => { const el = document.getElementById(id); if(el) el.textContent = val; };
      setVal("count-snore", counts.snore);
      setVal("count-brux", counts.bruxism);
      setVal("count-talk", counts.talk);
      setVal("count-fart", counts.fart);
      setVal("count-env", counts.env);
      setVal("count-apnea", counts.apnea);

      const total = counts.snore + counts.bruxism + counts.talk + counts.fart + counts.env;
      setVal("fc-all", total);
      setVal("fc-snore", counts.snore);
      setVal("fc-brux", counts.bruxism);
      setVal("fc-talk", counts.talk);
      setVal("fc-fart", counts.fart);
      setVal("fc-env", counts.env);
    }

    function monitorTick() {
      currentDb = calcDb();
      const spec = analyzeFrequencySpectrum();

      const dbEl = document.getElementById("dbText");
      const fillEl = document.getElementById("meterFill");
      const liveClassEl = document.getElementById("liveClassText");
      const centroidEl = document.getElementById("specCentroidText");

      if(dbEl) dbEl.textContent = `${currentDb.toFixed(1)} dB`;
      if(centroidEl) centroidEl.textContent = `${spec.centroid} Hz`;
      if(fillEl) {
        const pct = Math.min(100, Math.max(0, (currentDb - 20) * 1.5));
        fillEl.style.width = `${pct}%`;
        fillEl.style.background = currentDb >= baselineDb + 14 ? "var(--danger)" : (currentDb >= baselineDb + 6 ? "var(--warn)" : "#10b981");
      }

      if(baselineSamples.length < 30) {
        baselineSamples.push(currentDb);
        if(baselineSamples.length % 5 === 0) {
          const sorted = [...baselineSamples].sort((a,b)=>a-b);
          baselineDb = sorted[Math.floor(sorted.length/2)];
          document.getElementById("baseText").textContent = `${baselineDb.toFixed(1)} dB`;
        }
      }

      const now = Date.now();
      const delta = currentDb - baselineDb;

      const classResult = classifySound(delta, spec);

      if(classResult) {
        if(liveClassEl) liveClassEl.textContent = classResult.label;
        if(classResult.category === 'snore') snoreTimestamps.push(now);

        // 単発もすべて逃さず録音
        triggerClipRecording(classResult, currentDb, 10000);
      } else {
        if(liveClassEl && delta < 3.0) liveClassEl.textContent = "静寂 / 正常呼吸";
      }

      snoreTimestamps = snoreTimestamps.filter(t => (now - t) < 35000);

      // 無呼吸監視（連続いびき後の静寂＆あえぎ音）
      const isSilent = (delta < 2.5);
      if(snoreTimestamps.length >= 2) {
        if(isSilent) {
          if(silenceStartTime === null) silenceStartTime = now;
        } else {
          if(silenceStartTime !== null) {
            const silenceDurationSec = (now - silenceStartTime) / 1000;
            if(silenceDurationSec >= 15 && silenceDurationSec <= 60 && delta >= 14) {
              counts.apnea++;
              updateCountUI();
              const apneaResult = {
                category: 'snore',
                label: `⚠️ 無呼吸疑い（静寂${Math.round(silenceDurationSec)}秒後）`,
                tagClass: 'tag-snore'
              };
              triggerClipRecording(apneaResult, currentDb, 14000);
              toast(`無呼吸疑いを記録 (静寂${Math.round(silenceDurationSec)}秒)`);
              snoreTimestamps = [];
            }
            silenceStartTime = null;
          }
        }
      } else {
        silenceStartTime = null;
      }
    }

    async function startTracking() {
      if(isTracking) return;
      await initDB();

      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
        });
      } catch(e) {
        alert("マイクアクセス拒否: " + (e.message || e.name));
        return;
      }

      const AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
      if(audioCtx.state === "suspended") await audioCtx.resume();

      const src = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      analyser.smoothingTimeConstant = 0.4;
      src.connect(analyser);

      timeBuf = new Float32Array(analyser.fftSize);
      freqBuf = new Uint8Array(analyser.frequencyBinCount);

      await requestWakeLock();

      isTracking = true;
      recSec = 0;
      baselineSamples = [];
      snoreTimestamps = [];
      silenceStartTime = null;
      lastTriggerTime = 0;

      document.getElementById("statusBadge").textContent = "分類モニタ中";
      document.getElementById("statusBadge").className = "badge b-green";
      document.getElementById("btnStart").disabled = true;
      document.getElementById("btnStop").disabled = false;

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        recSec++;
        document.getElementById("timerText").textContent = formatHMS(recSec);
      }, 1000);

      // 500msの超省電力駆動
      clearInterval(monitorInterval);
      monitorInterval = setInterval(monitorTick, 500);

      toast("測定を開始しました");
    }

    async function stopTracking() {
      if(!isTracking) return;
      isTracking = false;

      clearInterval(timerInterval);
      clearInterval(monitorInterval);

      clearTimeout(clipStopTimeout);
      if(mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
      }

      releaseWakeLock();

      if(stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
      if(audioCtx) {
        audioCtx.close().catch(()=>{});
        audioCtx = null;
      }

      document.getElementById("statusBadge").textContent = "完了";
      document.getElementById("statusBadge").className = "badge b-gray";
      document.getElementById("btnStart").disabled = false;
      document.getElementById("btnStop").disabled = true;

      toast("測定終了。音声を耳で確認できます");
      switchTab('clips');
    }

    function filterCategory(cat, btn) {
      currentFilter = cat;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      renderClipList();
    }

    async function renderClipList() {
      const listEl = document.getElementById("clipList");
      if(!listEl) return;
      listEl.innerHTML = "";

      const allClips = await getClipsFromDB();
      const clips = currentFilter === 'all' 
        ? allClips 
        : allClips.filter(c => c.category === currentFilter);

      if(!clips || clips.length === 0) {
        listEl.innerHTML = `<div style="text-align:center; padding:30px; font-size:12px; color:var(--muted);">該当する録音データはありません。</div>`;
        return;
      }

      clips.forEach(clip => {
        const item = document.createElement("div");
        item.className = "clip-item";

        item.innerHTML = `
          <button class="play-btn" id="btn-play-${clip.id}">▶</button>
          <div class="clip-info">
            <div class="clip-title">
              <span class="badge ${clip.tagClass || 'tag-env'}">${clip.label}</span>
              <span style="font-size:11px; font-weight:normal; color:#94a3b8; font-family:ui-monospace;">${clip.peakDb.toFixed(1)} dB</span>
            </div>
            <div class="clip-sub">
              時刻: ${clip.realClock}（開始後 ${clip.timeStr}） / 長さ: 約${clip.durationSec}秒
            </div>
          </div>
          <a id="download-${clip.id}" class="btn btn-soft" style="padding:6px 10px; font-size:11px; text-decoration:none;">保存</a>
        `;

        listEl.appendChild(item);

        const playBtn = item.querySelector(`#btn-play-${clip.id}`);
        const dlBtn = item.querySelector(`#download-${clip.id}`);

        const audioUrl = URL.createObjectURL(clip.blob);
        dlBtn.href = audioUrl;
        dlBtn.download = `SleepSound_${clip.category}_${clip.realClock.replace(/:/g,"-")}.webm`;

        playBtn.onclick = () => {
          if(currentAudioPlayer) {
            currentAudioPlayer.pause();
            currentAudioPlayer = null;
            document.querySelectorAll('.play-btn').forEach(b => b.textContent = "▶");
          }

          const audio = new Audio(audioUrl);
          currentAudioPlayer = audio;
          playBtn.textContent = "⏸";

          audio.onended = () => {
            playBtn.textContent = "▶";
            currentAudioPlayer = null;
          };

          audio.play().catch(e => {
            toast("再生エラー: " + e.message);
            playBtn.textContent = "▶";
          });
        };
      });
    }

    async function clearClips() {
      if(!confirm("すべての録音クリップを消去しますか？")) return;
      if(currentAudioPlayer) { currentAudioPlayer.pause(); currentAudioPlayer = null; }
      await clearClipsFromDB();
      Object.keys(counts).forEach(k => counts[k] = 0);
      updateCountUI();
      await renderClipList();
      toast("全消去完了");
    }

    async function init() {
      try { await initDB(); } catch(e){}
      const clips = await getClipsFromDB();
      clips.forEach(c => {
        if(counts[c.category] !== undefined) counts[c.category]++;
      });
      updateCountUI();
    }

    return {
      init, switchTab, startTracking, stopTracking, clearClips, filterCategory
    };
  })();

  // 起動処理: GitHubの最新コード確認 → 完了後にアプリ初期化
  window.addEventListener("DOMContentLoaded", async () => {
    await GitHubLoader.init();
    App.init();
  });
</script>
